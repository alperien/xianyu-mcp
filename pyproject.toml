[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xianyu-mcp"
version = "0.2.0"
description = "Read-only Xianyu (Goofish) MCP server that needs no Xianyu account. No cookies, no login, no write tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
xianyu-mcp = "xianyu_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xianyu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
