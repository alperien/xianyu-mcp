name: ci

on:
  push:
    # `main` is the branch this repository publishes on; `master` is kept so a local
    # rename does not silently stop CI.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite's slowest tests are timer-bound retry loops, not I/O, so this is generous rather than tight.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact floor, not `^22`: unflagged type stripping landed in 22.18, and
      # 22.6-22.17 fail with ERR_UNKNOWN_FILE_EXTENSION. A caret range would let a runner bump
      # reintroduce that as an intermittent, hard-to-read failure.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Hermetic: the suite drives a fake session (setSession), imports no Playwright, and never
      # contacts goofish.com -- so this needs neither a browser nor network access. `npm ci` does
      # not download Chromium either, because playwright has no install script.
      - run: npm test

      # Guards the one thing the build can silently break: the emitted JS must carry .js specifiers,
      # not the .ts ones the sources import.
      - run: npm run build

      - name: the built entry point carries .js specifiers, not .ts
        run: |
          if grep -q "from \"\./[a-z]*\.ts\"" dist/index.js; then
            echo "dist/index.js still imports .ts -- rewriteRelativeImportExtensions is not taking effect"
            exit 1
          fi
          node --check dist/index.js

      # The stamp is what lets a deployed dist name its own commit. Without this step the build
      # succeeds and ships something that can only be dated by its mtime, which is how a deployment
      # nine commits behind main kept answering plausibly with nothing to say so.
      - name: the build is stamped with the commit it came from
        run: |
          if [ ! -f dist/build-info.json ]; then
            echo "dist/build-info.json is missing -- npm run build must call scripts/stamp-build.mjs"
            exit 1
          fi
          # --input-type=commonjs is not decoration: this package.json says "type": "module", and the
          # runner is free to hand `node -e` to the ESM loader, where a bare `require` is a
          # ReferenceError rather than a stamp check.
          node --input-type=commonjs -e '
            const s = require("./dist/build-info.json");
            const { execFileSync } = require("node:child_process");
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            if (s.commit !== head) { console.error(`stamp says ${s.commit}, HEAD is ${head}`); process.exit(1); }
            if (s.version !== require("./package.json").version) { console.error(`stamp version ${s.version} != package.json`); process.exit(1); }
            console.log(`stamped ${s.commit.slice(0, 7)} (${s.describe})`);
          '

      # A pull request is checked out detached with a synthetic merge commit, so origin/main is behind
      # by construction and the staleness verdict would fail on the merge itself. What is worth
      # asserting here is the part that must hold everywhere: the check runs, it names the commit it
      # compared against, and a build that cannot be placed is a failure rather than a silent pass.
      - name: the deploy check runs and refuses to pass an unplaceable build
        run: |
          node scripts/check-deploy.mjs --no-fetch --base HEAD || {
            echo "check:deploy failed on a checkout at its own HEAD; a build that cannot be shown current must fail loudly"
            exit 1
          }